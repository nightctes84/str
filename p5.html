<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pregunta 5 - Trivia SRT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
body{
    height:100vh;display:flex;justify-content:center;align-items:center;
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(-45deg,#00adef,#00567a,#007bb0,#00d2ff);
    background-size:400% 400%;animation:gradientBG 15s ease infinite;
    overflow: hidden;
}
@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.main-card{
    background:rgba(255,255,255,0.1);
    border-radius:40px;padding:40px;width:90%;max-width:600px;
    text-align:center;backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    position: relative;
    z-index: 2;
}
h2{color:#fff;font-size:1.5rem;margin-bottom:10px;text-transform:uppercase;opacity:.8;}
h1{color:#fff;font-size:2rem;margin-bottom:40px;line-height:1.3;text-shadow:0 2px 4px rgba(0,0,0,0.2);}

.options-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:40px;
}
.option-btn{
    background:rgba(255,255,255,0.1);
    border:2px solid rgba(255,255,255,0.3);
    border-radius:20px;padding:40px 20px;color:#fff;
    font-size:2rem;font-weight:bold;text-transform:uppercase;
    cursor:pointer;transition:.2s;
}
.option-btn.selected{
    background:#fff;color:#00567a;border-color:#fff;transform:scale(1.05);
}

.btn-confirmar{
    width:100%;background:#fff;color:#00567a;
    padding:22px;border-radius:50px;
    font-size:1.6rem;font-weight:bold;border:none;
    cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,0.2);
    text-transform: uppercase;
}

/* Estilos del Logo inferior derecho */
.logo-footer {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 150px;
    height: auto;
    opacity: 0.9;
    z-index: 10;
    pointer-events: none;
}

.overlay{
    display:none;position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);
    justify-content:center;align-items:center;z-index:100;
}
.modal{
    background:#fff;padding:40px;border-radius:30px;
    width:85%;max-width:500px;text-align:center;
}
.modal p{
    font-size:1.6rem;color:#333;margin-bottom:30px;line-height:1.4;
}
.btn-siguiente{
    display:inline-block;background:#00adef;color:#fff;
    padding:20px 40px;border-radius:50px;
    font-size:1.4rem;font-weight:bold;text-transform:uppercase;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="main-card">
    <h2>PREGUNTA 5</h2>
    <h1>¿Realizaste un chequeo médico integral en el último año?</h1>

    <div class="options-grid">
        <div class="option-btn" onclick="selectOption(this)">SI</div>
        <div class="option-btn" onclick="selectOption(this)">NO</div>
    </div>

    <button class="btn-confirmar" onclick="showFeedback()">Confirmar</button>
</div>

<img src="strlogo.png" alt="Logo SRT" class="logo-footer">

<div id="overlay" class="overlay">
    <div class="modal">
        <p>La OMS recomienda chequeos médicos periódicos para prevenir enfermedades crónicas y detectar riesgos tempranos. Incluye control de peso, tensión arterial y análisis de sangre y orina.</p>
        <a href="p6.html" class="btn-siguiente">Siguiente Pregunta</a>
    </div>
</div>

<script>
function selectOption(el){
    document.querySelectorAll('.option-btn').forEach(btn=>btn.classList.remove('selected'));
    el.classList.add('selected');
}
function showFeedback(){
    if(!document.querySelector('.option-btn.selected')) return;
    document.getElementById("overlay").style.display="flex";
}
</script>

</body>
</html>
