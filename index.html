<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desafío STR - Bienvenida</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Gradiente coherente con tus archivos p1-p5 */
            background: linear-gradient(-45deg, #00adef, #00567a, #007bb0, #00d2ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 2;
        }

        h2 {
            color: #ffffff;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .challenge-title {
            color: #ffffff;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            line-height: 1.1;
        }

        .intro-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.3rem;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .btn-desafio {
            display: block;
            width: 100%;
            background: #ffffff;
            color: #00567a;
            padding: 25px;
            border-radius: 50px;
            font-size: 1.6rem;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: all 0.3s;
            text-decoration: none;
        }

        .btn-desafio:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
            background: #f0f0f0;
        }

        .btn-desafio:active {
            transform: translateY(4px);
        }

        .logo-footer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: auto;
            opacity: 0.9;
            z-index: 10;
        }

        /* Animación de entrada para la tarjeta */
        .main-card {
            animation: cardFadeIn 1s ease-out;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>Seguridad y Salud</h2>
        <h1 class="challenge-title">¿Estás listo para el desafío?</h1>
        
        <p class="intro-text">
            Lo que estás por ver no es solo un cuestionario. Es una prueba de tus hábitos, conocimientos y nivel de prevención. 
            <br><br>
            <strong>¿Podrás superar todas las etapas con éxito?</strong>
        </p>

        <a href="trivia.html" class="btn-desafio">ACEPTAR EL RETO</a>
    </div>

    <img src="strlogo.png" alt="Logo SRT" class="logo-footer">

</body>
</html>
