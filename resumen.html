<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finalizado - Trivia SRT</title>
    <style>
        /* --- RESET Y ESTILOS BASE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Fondo azul coherente con el inicio */
            background: linear-gradient(-45deg, #00adef, #00567a, #007bb0, #00d2ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- TARJETA DE FINALIZACIÓN --- */
        .main-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            padding: 50px 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Icono de Éxito Animado */
        .success-icon {
            width: 100px;
            height: 100px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            font-size: 50px;
            color: #00adef;
            box-shadow: 0 0 30px rgba(255,255,255,0.4);
        }

        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: 800;
        }

        p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.4rem;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        /* --- BOTÓN VOLVER --- */
        .btn-inicio {
            display: inline-block;
            text-decoration: none;
            background: #ffffff;
            color: #00567a;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 20px 50px;
            border-radius: 60px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .btn-inicio:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.9);
        }

        .logo-footer {
            position: fixed;
            bottom: 20px;
            width: 130px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="success-icon">✓</div>
        
        <h1>¡Muchas Gracias!</h1>
        <p>Has completado el cuestionario de <br><strong>Salud y Seguridad</strong> exitosamente.</p>

        <a href="index.html" class="btn-inicio">
            Volver al Inicio
        </a>
    </div>

    <img src="strlogo.png" alt="Logo SRT" class="logo-footer">

</body>
</html>
