<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pregunta 13 - Seguridad e Higiene SRT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(-45deg, #2c3e50, #4ca1af, #2c3e50, #34495e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 2;
        }

        h2 {
            color: #ffffff;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 35px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            line-height: 1.3;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 25px;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .option-btn.selected {
            background: #ffffff;
            color: #2c3e50;
            border-color: #ffffff;
            transform: scale(1.05);
        }

        .btn-confirmar {
            display: block;
            width: 100%;
            background: #ffffff;
            color: #2c3e50;
            padding: 20px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .logo-footer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 140px;
            height: auto;
            opacity: 0.9;
            z-index: 10;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: white;
            padding: 35px;
            border-radius: 30px;
            width: 85%;
            max-width: 500px;
            text-align: center;
        }

        .modal p {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn-siguiente {
            display: inline-block;
            background: #e67e22;
            color: white;
            padding: 18px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>Pregunta 13</h2>
        <h1>Elementos de protección personal: ¿Los elementos de protección personal (EPP) son un accesorio opcional?</h1>

        <div class="options-grid">
            <div class="option-btn" onclick="selectOption(this)">Verdadero</div>
            <div class="option-btn" onclick="selectOption(this)">Falso</div>
        </div>

        <button class="btn-confirmar" onclick="showFeedback()">Confirmar</button>
    </div>

    <img src="strlogo.png" alt="Logo SRT" class="logo-footer">

    <div id="overlay" class="overlay">
        <div class="modal">
            <p>
                El EPP no es un accesorio: es protección para la vida. Usarlo siempre marca la diferencia entre el riesgo y el regreso seguro.
            </p>
            <a href="s6.html" class="btn-siguiente">Siguiente Pregunta</a>
        </div>
    </div>

    <script>
        function selectOption(el) {
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            el.classList.add('selected');
        }

        function showFeedback() {
            if (!document.querySelector('.option-btn.selected')) {
                alert("Por favor, selecciona una opción.");
                return;
            }
            document.getElementById('overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
